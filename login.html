<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Market | Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<header class="topbar">
    <div class="topbar__inner contenedor">
        <a href="index.html" class="marca">
            <img src="images/logo/logo.jpg" alt="PC Market" class="marca__logo-img">
            <span class="marca__nombre">PC<strong>MARKET</strong></span>
        </a>
    </div>
</header>

<main class="login-wrap">
    <div class="login-card">
        <h1>Iniciar sesión</h1>
        <p class="login-card__subtitulo">Entra con tu cuenta de cliente para comprar en línea.</p>

        <form id="formLogin" novalidate>
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" autocomplete="current-password" required>

            <p id="mensajeLogin" class="login-card__mensaje" hidden></p>

            <button type="submit" class="boton boton--primario login-card__boton">Iniciar Sesión</button>
        </form>
    </div>
</main>

<script src="js/script.js"></script>
<script>
document.getElementById("formLogin").addEventListener("submit", async (evento) => {
    evento.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const clave = document.getElementById("clave").value.trim();
    const mensaje = document.getElementById("mensajeLogin");

    mensaje.hidden = true;

    if (!usuario || !clave) {
        mensaje.textContent = "Ingresa usuario y contraseña.";
        mensaje.hidden = false;
        return;
    }

    try {
        const datos = new URLSearchParams({ usuario, clave });
        const respuesta = await fetch("api_login.php", { method: "POST", body: datos });
        const resultado = await respuesta.json();

        if (resultado.error) {
            mensaje.textContent = resultado.error;
            mensaje.hidden = false;
            return;
        }

        window.location.href = "perfil.html";
    } catch (error) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
        mensaje.hidden = false;
    }
});
</script>

</body>
</html>
